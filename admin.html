<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel admin · Slashwork</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="admin/admin.css">
</head>
<body class="admin-body">

<!-- ============ LOGIN ============ -->
<section class="admin-login" id="adminLogin">
  <div class="admin-login-card">
    <div class="eyebrow">Panel admin</div>
    <h1>Slashwork</h1>
    <p class="admin-login-sub">Entra para ver y responder los tickets de soporte.</p>
    <div class="sw-field">
      <label for="loginUser">Usuario</label>
      <input id="loginUser" type="text" autocomplete="username">
    </div>
    <div class="sw-field">
      <label for="loginPass">Contraseña</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <div class="sw-error" id="loginError" style="display:none;"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center;">Entrar</button>
  </div>
</section>

<!-- ============ PANEL ============ -->
<section class="admin-panel" id="adminPanel" style="display:none;">
  <header class="admin-topbar">
    <a href="index.html" class="brand"><span class="brand-mark">/</span>slashwork <span class="admin-tag">ADMIN</span></a>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Cerrar sesión</button>
  </header>

  <div class="admin-body-grid">
    <aside class="ticket-list" id="ticketList">
      <div class="ticket-list-head">
        <span>Tickets</span>
        <button class="btn-ghost-icon" id="refreshBtn" title="Actualizar">⟳</button>
      </div>
      <div id="ticketItems"><p class="admin-hint">Cargando...</p></div>
    </aside>

    <main class="ticket-detail" id="ticketDetail">
      <p class="admin-hint">Selecciona un ticket de la lista.</p>
    </main>
  </div>
</section>

<script src="admin/admin.js"></script>
</body>
</html>
